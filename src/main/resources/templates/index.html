<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LitBox - Consultar Catálogo</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" />
</head>
<body>

<div class="container">
    <header>
        <h1>📚 LitBox</h1>
        <p>Explorar e Consultar Catálogo de Livros | Opinar sobre seus livros favoritos</p>
    </header>


    <section class="top-books-section">
        <h2> Os 5 Livros Mais Bem Avaliados do Ano</h2>
        <div class="top-books-grid" id="topBooksGrid">
            <span th:text="${capaUrl}"></span>
            <span th:text="${titulo}"></span>
        </div>
    </section>

    <section class="panel">
        <h3>Catálogo de Livros</h3>

        <!-- Barra de Pesquisa por Nome/Título -->
        <form action="/externo" method="GET" class="search-bar">
            <input
                    type="text"
                    id="searchTitleInput"
                    name="termo"
                    placeholder="Digite o título do livro (ex: Java, Clean Code)..."
            />
            <button type="submit">Pesquisar</button>
            <a href="/" class="btn-cancel" style="text-decoration: none; padding: 10px; display: inline-block; text-align: center;">Limpar Busca</a>
        </form>

        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Editora</th>
                    <th>Ano</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody id="booksTableBody">
                <!-- Linhas geradas dinamicamente pelo Thymeleaf -->
                <tr th:each="livro : ${livros}">
                    <td th:text="${livro.titulo}">Título padrão</td>
                    <td th:text="${livro.autor}">Autor padrão</td>
                    <td th:text="${livro.editora}">Editora padrão</td>
                    <td th:text="${livro.ano}">Ano padrão</td>
                    <td>
                        <button type="button">Detalhes</button>
                    </td>
                </tr>

                <!-- Mensagem de segurança caso a lista esteja vazia -->
                <tr th:if="${#lists.isEmpty(livros)}">
                    <td colspan="5" style="text-align: center;">Nenhum livro encontrado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>


</body>
</html>
